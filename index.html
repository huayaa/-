<!-- Firebase SDK (バージョン10) の読み込み -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAvthBfRgLWZzbMj-o-hK2eaimWyO7LiMY",
  authDomain: "rst-000.firebaseapp.com",
  databaseURL: "https://rst-000-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "rst-000",
  storageBucket: "rst-000.firebasestorage.app",
  messagingSenderId: "774680536121",
  appId: "1:774680536121:web:1f330965f734ca5d9299e8",
  measurementId: "G-9S3LMQMZJ8"
};
        // Firebaseの初期化
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- 画面要素の取得 ---
        const authArea = document.getElementById('auth-area');
        const postArea = document.getElementById('post-area');
        const userStatus = document.getElementById('user-status');

        // --- 1. ログイン状態の監視 ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // ログインしている時
                userStatus.textContent = `ログイン中: ${user.email}`;
                authArea.style.display = 'none';
                postArea.style.display = 'block';
            } else {
                // ログアウトしている時
                userStatus.textContent = '未ログイン（閲覧のみ）';
                authArea.style.display = 'block';
                postArea.style.display = 'none';
            }
        });

        // --- 2. 新規登録機能 ---
        window.handleSignUp = async () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            try {
                await createUserWithEmailAndPassword(auth, email, pass);
                alert('アカウントを作成し、ログインしました！');
            } catch (e) {
                alert('登録エラー: ' + e.message);
            }
        };

        // --- 3. ログイン機能 ---
        window.handleLogin = async () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                alert('ログインしました！');
            } catch (e) {
                alert('ログインエラー: ' + e.message);
            }
        };

        // --- 4. ログアウト機能 ---
        window.handleLogout = () => {
            signOut(auth);
        };

        // --- 5. 用語の投稿機能 ---
        window.handlePostTerm = async () => {
            const title = document.getElementById('post-title').value;
            const category = document.getElementById('post-category').value;
            const description = document.getElementById('post-desc').value;
            const authorName = document.getElementById('post-author').value || '匿名社員';

            if (!title || !description) {
                alert('タイトルと解説は必須です！');
                return;
            }

            try {
                // Firestoreの 'glossary' コレクションに保存
                await addDoc(collection(db, "glossary"), {
                    title: title,
                    category: category,
                    description: description,
                    author: authorName,
                    createdAt: new Date()
                });
                alert('用語をデータベースに記録しました！');
                // フォームをリセット
                document.getElementById('post-title').value = '';
                document.getElementById('post-desc').value = '';
            } catch (e) {
                alert('投稿エラー: ' + e.message);
            }
        };

        // --- 6. 投稿データのリアルタイム自動読み込み ---
        const glossaryContainer = document.getElementById('glossary');
        const dynamicSection = document.createElement('div');
        dynamicSection.className = 'card';
        dynamicSection.innerHTML = '<h2>オンライン投稿アーカイブ</h2><div id="dynamic-terms"></div>';
        glossaryContainer.appendChild(dynamicSection);

        const dynamicTermsContainer = document.getElementById('dynamic-terms');

        // データに変更があったら自動で画面を更新する
        const q = query(collection(db, "glossary"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            dynamicTermsContainer.innerHTML = '';
            snapshot.forEach((doc) => {
                const data = doc.data();
                const box = document.createElement('div');
                box.className = 'note-box';
                box.style.marginBottom = '15px';
                box.innerHTML = `
                    <div style="font-weight:bold; color:var(--accent-white); font-size:1rem;">
                        ${data.title} <span style="font-size:0.75rem; color:var(--text-dim); font-weight:normal;">[${data.category}]</span>
                    </div>
                    <div style="margin-top:5px;">${data.description}</div>
                    <div style="text-align:right; font-size:0.75rem; color:var(--text-dim); margin-top:5px;">記録者: ${data.author}</div>
                `;
                dynamicTermsContainer.appendChild(box);
            });
        });
    </script>
